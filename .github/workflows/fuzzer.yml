name: "Fuzzer"
on:
  workflow_dispatch:
    inputs:
      max-total-time:
        description: 'Max total time in seconds for each fuzzer'
        required: false
        default: '1800'
        type: string
  workflow_call:
    inputs:
      max-total-time:
        description: 'Max total time in seconds for each fuzzer'
        required: false
        default: '1800'
        type: string

jobs:
  Run-Decode-Fuzzer:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install nix
      uses: cachix/install-nix-action@v31

    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982

    - name: Build Fuzzer
      run: |
        nix develop -c bash ci/build_fuzz.sh

    - name: Run Decode Fuzzer
      run: |
        cd build-fuzz
        ASAN_OPTIONS=detect_leaks=0 PYTHONPATH=${{ github.workspace }}/test_data/fuzzer \
          ./ssrjson_decode_fuzzer -dict=fuzzer.dict \
          -max_total_time=${{ inputs.max-total-time || '300' }} decode_corpus

  Run-Encode-Fuzzer:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install nix
      uses: cachix/install-nix-action@v31

    - name: Setup cachix
      uses: cachix/cachix-action@v17
      with:
        name: antares0982

    - name: Build Fuzzer
      run: |
        nix develop -c bash ci/build_fuzz.sh

    - name: Run Encode Fuzzer
      run: |
        cd build-fuzz
        ASAN_OPTIONS=detect_leaks=0 PYTHONPATH=${{ github.workspace }}/test_data/fuzzer \
          ./ssrjson_encode_fuzzer -dict=encode_fuzzer.dict \
          -max_total_time=${{ inputs.max-total-time || '300' }}

  Run-Decode-Fuzzer-MacOS:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install LLVM
      run: brew install llvm

    - name: Build Fuzzer
      run: |
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        export CC=clang
        export CXX=clang++
        INCLUDE=$(python3 -c "import sysconfig,os;print(os.path.dirname(sysconfig.get_config_h_filename()))")
        MINOR=$(python3 -c "import sys;print(sys.version_info.minor)")
        LIBDIR=$(python3 -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))")
        export Python3_INCLUDE_DIR="$INCLUDE"
        export Python3_LIBRARY="$LIBDIR/libpython3.$MINOR.dylib"
        bash ci/macos_build_fuzz.sh build-fuzz

    - name: Run Decode Fuzzer
      run: |
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        cd build-fuzz
        ASAN_OPTIONS=detect_leaks=0 \
        PYTHONPATH=${{ github.workspace }}/test_data/fuzzer \
        MallocNanoZone=0 \
          ./ssrjson_decode_fuzzer -dict=fuzzer.dict \
          -max_total_time=${{ inputs.max-total-time || '300' }} decode_corpus

  Run-Encode-Fuzzer-MacOS:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install LLVM
      run: brew install llvm

    - name: Build Fuzzer
      run: |
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        export CC=clang
        export CXX=clang++
        INCLUDE=$(python3 -c "import sysconfig,os;print(os.path.dirname(sysconfig.get_config_h_filename()))")
        MINOR=$(python3 -c "import sys;print(sys.version_info.minor)")
        LIBDIR=$(python3 -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))")
        export Python3_INCLUDE_DIR="$INCLUDE"
        export Python3_LIBRARY="$LIBDIR/libpython3.$MINOR.dylib"
        bash ci/macos_build_fuzz.sh build-fuzz

    - name: Run Encode Fuzzer
      run: |
        export PATH="$(brew --prefix llvm)/bin:$PATH"
        cd build-fuzz
        ASAN_OPTIONS=detect_leaks=0 \
        PYTHONPATH=${{ github.workspace }}/test_data/fuzzer \
        MallocNanoZone=0 \
          ./ssrjson_encode_fuzzer -dict=encode_fuzzer.dict \
          -max_total_time=${{ inputs.max-total-time || '300' }}
