name: "Run Test (aarch64 MacOS)"
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "src/**"
      - "test/**"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "CMakeLists.txt"


jobs:
  run-test:
    name: "run MacOS tests"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["macos-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Tests
        id: tests
        run: |
          python -m pip install pytest pytest-xdist pytest-random-order setuptools wheel
          cp -r pysrc/ ssrjson/
          python -m pip install . --prefix build-py
          rm -rf ssrjson/
          minor=$(python -c "import sys;print(sys.version_info.minor)")
          export PYTHONPATH="$PWD/build-py/lib/python3.$minor/site-packages:$PYTHONPATH"
          export SSRJSON_BINARY="$PWD/build-py/lib/python3.$minor/site-packages/ssrjson/ssrjson.so"
          if otool -L "$SSRJSON_BINARY" 2>/dev/null | grep -q 'Python'; then
            echo "Error: 'Python' found in otool -L output." >&2
            exit 1
          fi
          python -m pytest --random-order python-test
