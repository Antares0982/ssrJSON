name: "Run Test (aarch64 MacOS)"
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "src/**"
      - "python-test/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "ci/**"
      - ".github/workflows/**"
      - "pysrc/**"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/run-test-macos.yml"
  pull_request:
    paths:
      - "src/**"
      - "python-test/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "ci/**"
      - ".github/workflows/**"
      - "pysrc/**"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/run-test-macos.yml"


jobs:
  run-test:
    name: "run MacOS tests"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        os: ["macos-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Run Tests
        id: tests
        run: |
          python -m pip install pytest pytest-xdist pytest-random-order setuptools wheel numpy
          python -m pip install . --prefix build-py
          export PYTHONPATH="$PWD/build-py/lib/python${{ matrix.python-version }}/site-packages:$PYTHONPATH"
          export SSRJSON_BINARY="$PWD/build-py/lib/python${{ matrix.python-version }}/site-packages/ssrjson/ssrjson.so"
          python - <<'PY'
          import importlib.resources
          import ssrjson
          data = {"key": [1, True, None]}
          assert ssrjson.__version__
          assert ssrjson.get_current_features()["simd"] == "NEON"
          assert ssrjson.get_current_features()["multi_lib"] is False
          assert ssrjson.loads(ssrjson.dumps(data)) == data
          assert all(importlib.resources.files(ssrjson).joinpath(name).is_file()
                     for name in ("__init__.pyi", "py.typed"))
          PY
          if otool -L "$SSRJSON_BINARY" 2>/dev/null | grep -q 'Python'; then
            echo "Error: 'Python' found in otool -L output." >&2
            exit 1
          fi
          python -m pytest --random-order python-test

      - name: Test NEON with shipping SIMD disabled
        if: matrix.python-version == '3.14'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-single -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DBUILD_SHIPPING_SIMD=OFF -DBUILD_SCALAR=OFF -DBUILD_NATIVE=OFF
          cmake --build build-single -j 3
          export PYTHONPATH="$PWD/build-single"
          python -c 'import ssrjson; assert ssrjson.get_current_features()["simd"] == "NEON"; assert ssrjson.get_current_features()["multi_lib"] is False'
          ctest --test-dir build-single --output-on-failure
          python -m pytest --random-order python-test/test_api.py python-test/test_portable.py

      - name: Test scalar backend
        if: matrix.python-version == '3.14'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-scalar -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(command -v python)" \
            -DBUILD_SHIPPING_SIMD=OFF -DBUILD_SCALAR=ON -DBUILD_NATIVE=OFF
          cmake --build build-scalar -j 3
          export PYTHONPATH="$PWD/build-scalar"
          python -c 'import ssrjson; assert ssrjson.get_current_features()["simd"] == "SCALAR"; assert ssrjson.get_current_features()["multi_lib"] is False'
          ctest --test-dir build-scalar --output-on-failure
          python -m pytest --random-order python-test
