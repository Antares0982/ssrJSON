name: "Address Sanitizer Check"
on:
  workflow_dispatch:

jobs:
  ASAN-CHECK:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["10", "11", "12", "13", "14", "15"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install nix
      uses: cachix/install-nix-action@master
    - name: Setup cachix
      uses: cachix/cachix-action@master
      with:
        name: antares0982
    - name: Run asan check
      run: |
        nix develop -c python ./dev_tools/automated_test.py --pyver ${{ matrix.pyver }} --asan
