name: "Run Test (x86_64 Windows)"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "dev"
    paths:
      - "src/**"
      - "python-test/**"
      - "cmake/**"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "src/**"
      - "python-test/**"
      - "cmake/**"
      - "CMakeLists.txt"

jobs:
  run-test:
    name: "run Windows tests"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        os: ["windows-latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Run Tests
        id: tests
        run: |
          python -m pip install pytest numpy
          python ci\windows_test.py
